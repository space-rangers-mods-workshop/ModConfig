# Advanced adjustment — a schematic map of the game's extended new-game panel.
#
# Sources, in order of authority:
#   * the form's own code, `source/SpaceRangersHD_decomp/source/screens/fGameSettings2.pas` —
#     the three groups, their order, the slider bounds and the value/caption pairs;
#   * `TGalaxyCustomRules` (`source/.../game/aGalaxyStruct.pas:380`) — the parameter names and the
#     byte offsets;
#   * the game's `Lang.dat` block `FormGameSet2.Extended` — the captions.
#
# `id` is the byte offset inside `Galaxy.CustomRules`; it is also how the value is stored in the
# save (`Galaxy + 392 + id`), and it is the same numbering the game's own `AATypes` block uses.
#
# `after_start` says whether the parameter can still be changed once the game has started:
#   live   — the engine reads the value during play, so changing it in a running galaxy works;
#   locked — the engine reads it only while a new galaxy is generated, so changing it mid-game
#            has no effect (the byte is simply never consulted again).
#
# `type`:
#   number — a slider. `min`/`max` are the bounds of the value stored in the galaxy (not of the
#            slider handle); `display` gives how it is shown;
#   enum   — a choice. `values` lists the stored byte and the caption key for each option.

master:
  param: Enabled
  id: 0
  caption: FormGameSet2.Extended.Button
  text: Advanced adjustment
  type: enum
  values:
    - value: 0
      caption: FormGameSet2.Extended.Off
      text: "OFF"
    - value: 1
      caption: FormGameSet2.Extended.On
      text: "ON"
  after_start: live
  note: >-
    Gates every other option: when it is off, the engine's own accessors return their defaults and
    none of the parameters below has any effect.

